<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <title>Nemesis Delta</title>
        <link rel="icon" type="image/svg+xml" href="assets/signalk-nemesis.svg" />
        <link rel="apple-touch-icon" href="assets/signalk-nemesis-192x192.png" />
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <header class="topbar">
            <div class="brand">
                <div class="name">NEMESIS<span> DELTA</span></div>
                <div class="sub" id="conn">connecting</div>
            </div>
            <div class="ctl-group">
                <span class="ctl-label">Mode</span>
                <select id="modeSel">
                    <option value="abs">Absolute</option>
                    <option value="rel">Relative</option>
                </select>
            </div>
            <div class="ctl-group">
                <span class="ctl-label">Up</span>
                <select id="upSel">
                    <option value="waypoint">Waypoint</option>
                    <option value="course">Course</option>
                    <option value="cog">COG</option>
                    <option value="north">North</option>
                    <option value="wind" disabled>Wind</option>
                </select>
            </div>
            <button class="timebtn" id="timeBtn" title="race time and period">
                <span id="timeBtnVal">time</span> &#9662;
            </button>
        </header>

        <div class="timepop hidden" id="timepop">
            <div class="trow">
                <span class="tl">Time</span>
                <button class="playbtn" id="backBtn" title="10 minutes back">&#8249;</button>
                <button class="playbtn" id="liveBtn" title="back to live">Live</button>
                <button class="playbtn" id="fwdBtn" title="10 minutes forward">&#8250;</button>
                <span class="tv wide" id="timeVal">--</span>
            </div>
            <div class="trow full">
                <input type="range" id="timeSlider" min="0" max="1" value="1" step="1" />
            </div>
            <div class="trow">
                <span class="tl">Period</span>
                <input type="range" id="periodSlider" min="10" max="240" step="10" value="60" />
                <span class="tv" id="periodVal">60 min</span>
            </div>
            <div class="trow">
                <span
                    class="tl"
                    title="a boat is greyed and its lines are broken only when its latest report is older than this; shorter gaps (missed AIS reports) are bridged"
                    >Stale after</span
                >
                <input type="number" id="staleMin" min="5" max="240" step="5" value="30" class="numin" />
                <span class="tv" style="width: auto; text-align: left">min without a report</span>
            </div>
        </div>

        <div class="selbar">
            <div class="ctl-group">
                <span class="ctl-label">Show</span>
                <select id="showSel">
                    <option value="nemeses">Nemeses</option>
                    <option value="sailing">Sailing</option>
                    <option value="all">All</option>
                    <option value="inrange">In range</option>
                    <option value="none">None</option>
                </select>
            </div>
            <span class="fleetc"><b>Boats</b> <span id="fleetCount">0/0</span></span>
        </div>

        <nav class="tabbar" id="tabbar">
            <button data-tab="boats">Boats</button>
            <button data-tab="tcf">TCF</button>
            <button data-tab="vectors">Vectors</button>
            <button data-tab="geo">Geo</button>
            <button data-tab="course">Course</button>
            <button data-tab="cyca">CYCA</button>
        </nav>

        <main class="stage">
            <section class="tabpane" id="pane-boats">
                <div class="plothead">
                    <button class="info" data-info="boats" aria-label="about this view">i</button>
                    <div class="mode"><b>Boats</b></div>
                    <div class="ctl-group">
                        <span class="ctl-label">Sort</span>
                        <select id="sortSel">
                            <option value="near">Near</option>
                            <option value="waypoint">Waypoint</option>
                            <option value="vmg">VMG</option>
                            <option value="alpha">A-Z</option>
                        </select>
                    </div>
                </div>
                <div class="bhead" id="bhead"></div>
                <div class="blist" id="blist"></div>
            </section>
            <section class="tabpane hidden" id="pane-vectors">
                <div class="plothead">
                    <button class="info" data-info="vectors" aria-label="about this view">i</button>
                    <div class="mode" id="modeLine"></div>
                    <div class="mode" id="scaleLine"></div>
                </div>
                <div class="svgwrap"><svg class="polar" id="polar" viewBox="0 0 400 400"></svg></div>
            </section>
            <section class="tabpane hidden" id="pane-tcf">
                <div class="plothead">
                    <button class="info" data-info="tcf" aria-label="about this view">i</button>
                    <div class="mode"><b>TCF</b> <span id="tcfNote"></span></div>
                </div>
                <div class="startbar" id="startbar">
                    <span class="ctl-label">Start</span>
                    <span class="startval" id="startVal">--</span>
                    <input type="datetime-local" step="1" id="startIn" />
                    <button class="mapbtn" id="startSet">Set</button>
                    <button class="mapbtn" id="startNow">Now</button>
                    <button class="mapbtn" id="startClear" title="clear the override and use signalk-racer">
                        Clear
                    </button>
                </div>
                <div class="coursebar" id="tcfMethod"></div>
                <div class="bhead thead" id="tcfhead"></div>
                <div class="blist" id="tcflist"></div>
            </section>
            <section class="tabpane hidden" id="pane-geo">
                <div class="plothead">
                    <button class="info" data-info="geo" aria-label="about this view">i</button>
                    <div class="mode" id="mapLine">Geographic</div>
                    <div class="hbtns">
                        <div class="seg" id="baseSeg">
                            <button data-base="white">White</button><button data-base="osm">OSM</button
                            ><button data-base="sea">Sea</button>
                        </div>
                        <button class="mapbtn" id="fitBtn">Fit</button>
                    </div>
                </div>
                <div class="mapbox">
                    <svg class="map" id="map" viewBox="0 0 700 500">
                        <defs>
                            <clipPath id="mapclip">
                                <rect id="mapcliprect" x="0" y="0" width="700" height="500" />
                            </clipPath>
                        </defs>
                        <rect id="mapbg" x="0" y="0" width="700" height="500" fill="#ffffff" />
                        <g clip-path="url(#mapclip)">
                            <g id="maprot">
                                <g id="maptiles"></g>
                                <g id="mapcontent"></g>
                            </g>
                            <g id="maprings"></g>
                        </g>
                        <g id="mapoverlay"></g>
                    </svg>
                </div>
            </section>
            <section class="tabpane hidden" id="pane-course">
                <div class="plothead">
                    <button class="info" data-info="course" aria-label="about this view">i</button>
                    <div class="mode"><b>Course</b></div>
                </div>
                <div class="startbar">
                    <select id="courseAdd" class="racesel" aria-label="waypoint to add"></select>
                    <button class="mapbtn" id="courseAddBtn">Add</button>
                </div>
                <div class="startbar">
                    <select id="courseRoute" class="racesel" aria-label="route to import"></select>
                    <button class="mapbtn" id="courseImport">Import route</button>
                    <button class="mapbtn" id="courseRefresh" title="read the waypoints and routes again">
                        Refresh
                    </button>
                </div>
                <div class="coursebar" id="courseStatus"></div>
                <div class="blist" id="courselist"></div>
            </section>
            <section class="tabpane hidden" id="pane-cyca">
                <div class="plothead">
                    <button class="info" data-info="cyca" aria-label="about this view">i</button>
                    <div class="mode"><b>CYCA tracker</b></div>
                </div>
                <div class="startbar">
                    <span class="ctl-label">Race</span>
                    <select id="cycaRace" class="racesel" aria-label="CYCA race"></select>
                    <button class="mapbtn" id="cycaRefresh" title="read the race list from the CYCA feed">
                        Refresh
                    </button>
                </div>
                <div class="coursebar">
                    <span id="cycaStatus"></span>
                    <button class="mapbtn hidden" id="cycaLinkAll">Link all suggested</button>
                </div>
                <div class="blist" id="cycalist"></div>
            </section>
        </main>

        <div class="tip" id="tip"></div>
        <div class="infopop" id="infoPop"></div>

        <script src="units.js"></script>
        <script src="geo.js"></script>
        <script src="derive.js"></script>
        <script src="draw.js"></script>
        <script src="app.js"></script>
        <script src="tab-boats.js"></script>
        <script src="tab-vectors.js"></script>
        <script src="tab-tcf.js"></script>
        <script src="tab-geo.js"></script>
        <script src="tab-course.js"></script>
        <script src="tab-cyca.js"></script>
    </body>
</html>
